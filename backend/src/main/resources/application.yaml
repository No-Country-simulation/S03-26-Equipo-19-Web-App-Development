spring:
  port: ${PORT:8080}

  # Configuración de zona horaria
  jackson:
    time-zone: America/Argentina/Buenos_Aires

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&serverTimezone=America/Argentina/Buenos_Aires
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  # Configuración de caché
  cache:
    type: simple

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# WhatsApp Cloud API Configuration
whatsapp:
  api:
    url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    token: ${WHATSAPP_API_TOKEN:}

# Brevo (Email) Configuration
brevo:
  api:
    url: ${BREVO_API_URL:https://api.brevo.com/v3}
    key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_SENDER_EMAIL:}
    name: ${BREVO_SENDER_NAME:CRM System}

# Logging configuration
logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
